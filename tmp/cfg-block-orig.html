  .fz-cfg{

    --text:#f4f2ef;
    --text-dim:#9b9793;
    --text-faint:#635f5b;
    --accent:#b3332b;
    --accent-hover:#c8443b;

  .fz-cfg .app{

  .fz-cfg .eyebrow-label{

    font-weight:700;

    text-transform:uppercase;

    line-height:1.15;
    text-wrap:balance;

  .fz-cfg .subline{

    flex-direction:column;
    gap:2px;
    position:sticky;
    top:24px;
  }
  @media (max-width:860px){
    .fz-cfg .stepper{
      position:static;
      flex-direction:row;
      overflow-x:auto;
      gap:0;
      padding-bottom:4px;
    }
  }

  .fz-cfg .step-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:12px 10px;
    border-radius:10px;
    opacity:0.45;
    transition:opacity .2s ease;
  }
  .fz-cfg .step-row.done, .fz-cfg .step-row.active{ opacity:1; }

      gap:6px;

    }
    .fz-cfg .step-row.active{ border-bottom-color:var(--accent); }
  }

  .fz-cfg .step-num{
    width:26px;height:26px;
    border-radius:50%;
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;
    color:var(--text-dim);
    flex-shrink:0;
    transition:all .2s ease;
  }
  .fz-cfg .step-row.active .step-num{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .fz-cfg .step-row.done .step-num{
    background:transparent;
    border-color:var(--accent);
    color:var(--accent);
  }
  .fz-cfg .step-copy{ min-width:0; }
  .fz-cfg .step-title{
    font-size:13px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .fz-cfg .step-value{
    font-size:12px;
    color:var(--accent);
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .fz-cfg .step-value:empty::before{
    content:'—';
    color:var(--text-faint);
  }

  .fz-cfg .panel{ min-width:0; }
  .fz-cfg .panel-heading{
    font-size:12px;
    font-weight:600;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--text-faint);
    margin:0 0 4px;
  }
  .fz-cfg .panel-question{
    font-size:clamp(19px,2.4vw,25px);
    font-weight:600;
    margin:0 0 22px;
    text-wrap:balance;
  }

  .fz-cfg .brand-search{
    max-width:280px;
    margin:0 0 28px;
    position:relative;
  }
  .fz-cfg .brand-search input{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:9px;
    padding:10px 14px 10px 34px;
    color:var(--text);
    font-size:13.5px;
    font-family:'Inter',sans-serif;
  }
  .fz-cfg .brand-search input:focus{ outline:none; border-color:var(--accent); }
  .fz-cfg .brand-search input::placeholder{ color:var(--text-faint); }

    border-radius:50%;
  }
  .fz-cfg .brand-search::after{
    content:'';
    position:absolute;
    left:21px; top:50%;
    width:5px; height:1.5px;
    margin-top:3px;
    background:var(--text-faint);
    transform:rotate(45deg);
    transform-origin:left center;
  }

  .fz-cfg .option-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
    gap:12px;
  }
  .fz-cfg .option-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px 14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .fz-cfg .option-card:hover{ border-color:#3a3a3a; transform:translateY(-1px); }
  .fz-cfg .option-card.selected{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .fz-cfg .option-glyph{
    width:44px;height:44px;
    border-radius:50%;
    background:var(--surface-2);
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:14px;
    font-weight:600;
    color:var(--text-dim);
  }
  .fz-cfg .option-card.selected .option-glyph{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .fz-cfg .option-label{
    font-size:13.5px;
    font-weight:600;
    color:var(--text);
  }
  .fz-cfg .option-sub{
    font-size:11.5px;
    color:var(--text-faint);
  }

  .fz-cfg .option-glyph svg{ width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.6; }

  .fz-cfg .option-card.disabled{ cursor:not-allowed; opacity:0.4; }
  .fz-cfg .option-card.disabled:hover{ border-color:var(--border); transform:none; }
  .fz-cfg .option-card.disabled .option-glyph{ background:var(--surface); }
  .fz-cfg .option-card.disabled .option-sub{ font-style:italic; }
  .fz-cfg .option-card.disabled .option-sub b{ color:#8a7370; font-style:normal; }
  .fz-cfg .option-card.photo.disabled .photo-bg{ filter:grayscale(1) brightness(.5); }
  .fz-cfg .option-card.photo .option-sub{ color:rgba(255,255,255,0.65); }
  .fz-cfg .option-card.photo.disabled .option-sub{ color:rgba(255,255,255,0.55); }

  .fz-cfg .style-grid{ grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; }
  .fz-cfg .style-grid .option-card.photo{ aspect-ratio:1/1; }
  .fz-cfg .style-grid .option-label{ font-size:17px; }
  .fz-cfg .style-grid .option-sub{ font-size:13px; }
  .fz-cfg .style-grid .photo-overlay{ padding:16px 16px 14px; }

    .fz-cfg .style-grid{ grid-template-columns:repeat(2,1fr) !important; gap:10px !important; }

    .fz-cfg .style-grid .option-sub{ font-size:10.5px !important; }
    .fz-cfg .style-grid .photo-overlay{ padding:10px 10px 8px !important; }

    color:var(--text);

  .fz-cfg .summary-row dd{ margin:0; font-weight:600; color:var(--text); }

  .fz-cfg .success-title{
    font-size:20px;

    text-transform:uppercase;

  .fz-cfg .success-text{
    color:var(--text-dim);
    font-size:14px;
    max-width:44ch;
    margin:0 auto;
    line-height:1.6;
  }

  .fz-cfg [hidden]{ display:none!important; }

  /* На странице конфигуратора форма заявки из общего подвала не нужна — свой сбор параметров есть на шаге "Заявка" */
  .fz-cta{ display:none !important; }

    'Mini':'https://cdn.jsdelivr.net/gh/frzwls/forza-blog-media@85f3e000d9b8fbd8b6887aad28a7f255c48c33aa/assets/cfg-logos/mini.svg',
    'Nissan':'https://cdn.jsdelivr.net/gh/frzwls/forza-blog-media@85f3e000d9b8fbd8b6887aad28a7f255c48c33aa/assets/cfg-logos/nissan.svg',
    'Polar':'https://cdn.jsdelivr.net/gh/frzwls/forza-blog-media@85f3e000d9b8fbd8b6887aad28a7f255c48c33aa/assets/cfg-logos/polar.svg',
    'Porsche':'https://cdn.jsdelivr.net/gh/frzwls/forza-blog-media@85f3e000d9b8fbd8b6887aad28a7f255c48c33aa/assets/cfg-logos/porsche.svg',
    'Rolls-Royce':'https://cdn.jsdelivr.net/gh/frzwls/forza-blog-media@85f3e000d9b8fbd8b6887aad28a7f255c48c33aa/assets/cfg-logos/rolls-royce.svg',
    'Tank':'https://cdn.jsdelivr.net/gh/frzwls/forza-blog-media@85f3e000d9b8fbd8b6887aad28a7f255c48c33aa/assets/cfg-logos/tank.svg',
    'Tesla':'https://cdn.jsdelivr.net/gh/frzwls/forza-blog-media@85f3e000d9b8fbd8b6887aad28a7f255c48c33aa/assets/cfg-logos/tesla.svg',
    'Toyota':'https://cdn.jsdelivr.net/gh/frzwls/forza-blog-media@85f3e000d9b8fbd8b6887aad28a7f255c48c33aa/assets/cfg-logos/toyota.svg',
    'Volkswagen':'https://cdn.jsdelivr.net/gh/frzwls/forza-blog-media@85f3e000d9b8fbd8b6887aad28a7f255c48c33aa/assets/cfg-logos/volkswagen.svg',
    'Xiaomi':'https://cdn.jsdelivr.net/gh/frzwls/forza-blog-media@85f3e000d9b8fbd8b6887aad28a7f255c48c33aa/assets/cfg-logos/xiaomi.svg',
    'Zeekr':'https://cdn.jsdelivr.net/gh/frzwls/forza-blog-media@85f3e000d9b8fbd8b6887aad28a7f255c48c33aa/assets/cfg-logos/zeekr.png'
  };

  function fzLogoSize(im){
    var ar = im.naturalWidth / (im.naturalHeight || 1);
    var w = ar <= 1.2 ? 40 : ar <= 1.6 ? 50 : ar <= 2.5 ? 60 : ar <= 4 ? 70 : 84;
    im.style.width = w + '%';
  }

  function resizeUrl(url, w){
    var parts = url.split('/');
    var filename = parts.pop();
    return parts.join('/') + '/-/resize/' + w + 'x/' + filename;
  }

  var CAR_BRANDS = ['Aito','Audi','Avatr','BMW','BYD','Cadillac','Chevrolet','Denza','Dodge',
    'Harley-Davidson','Hummer','Hyundai','Indian','Infiniti','Jetour','KIA','Lamborghini',
    'Land Rover','Lexus','Lixiang','Lucid','McLaren','Mercedes-Benz','Mercedes-Maybach','Mini',
    'Nissan','Polar','Porsche','Rolls-Royce','Tank','Tesla','Toyota','Volkswagen','Xiaomi','Zeekr'];

  var DISK_STYLES = [
    { key:'mono', label:'Моноблок', sub:'цельный, из одной заготовки' },
    { key:'multi', label:'2 / 3-составные', sub:'диск и обод — разные части' },
    { key:'beadlock', label:'Бедлок', sub:'прижимное кольцо по контуру' },
    { key:'spoke', label:'Спицевые', sub:'классический рисунок спиц' }
  ];
  var STYLE_PHOTOS = {
    mono: 'https://static.tildacdn.pro/stor6231-3238-4866-b432-633537353637/b4a677f1df15d93f107dbc3df06ef18e.jpg',
    multi: 'https://forzaaa.com/cdn/shop/files/22-inch-forged-wheels-rims-for-bmw-x5-g05-g18-2024-sdrive40i-ax424-1.jpg?v=1788865455',
    beadlock: 'https://forzaaa.com/cdn/shop/files/17-inch-beadlock-forged-wheels-rims-for-nissan-patrol-y61_8.jpg?v=1751973919',
    spoke: 'https://forzaaa.com/cdn/shop/files/forged-wire-wheels-rims-for-rolls-royce-spectre-cullinan-dawn-ghost-phantom-wraith_10.jpg?v=1754372542'
  };
  function allowedStyles(brand){
    return ['mono','multi','beadlock','spoke'];
  }

  var STEPS = [
    {
      key:'brand', title:'Марка авто', question:'Какой у вас автомобиль?',
      options: CAR_BRANDS.map(function(b){ return {v:b}; }).concat([{v:'Другая марка', other:true}])
    },
    {
      key:'disk', title:'Диски', question:'Какой стиль диска вам нужен?',
      options:['R16','R17','R18','R19','R20','R21','R22','R23','R24','R26'].map(function(d){ return {v:d}; })
    },
    { key:'lead', title:'Заявка' }
  ];

  var selection = {};
  var current = 0;
  var submitted = false;

  var stepperEl = document.getElementById('fzCfgStepper');
  var bodyEl = document.getElementById('fzCfgBody');
  var btnBack = document.getElementById('fzCfgBack');
  var btnNext = document.getElementById('fzCfgNext');

  function renderStepper(){
    stepperEl.innerHTML = '';
    STEPS.forEach(function(s, i){
      var isPast = i < current;
      var row = document.createElement('div');
      row.className = 'step-row' + (i === current ? ' active' : '') + (isPast ? ' done' : '') + (isPast ? ' clickable' : '');
      var num = document.createElement('div');
      num.className = 'step-num';
      num.textContent = isPast ? '✓' : String(i + 1);
      var copy = document.createElement('div');
      copy.className = 'step-copy';
      var title = document.createElement('div');
      title.className = 'step-title';
      title.textContent = s.title;
      var val = document.createElement('div');
      val.className = 'step-value';
      val.textContent = (i <= current)
        ? ((s.key === 'brand' && selection.brand === 'Другая марка') ? (selection.brandOther || 'Другая марка')
          : (s.key === 'disk') ? [ (DISK_STYLES.filter(function(x){ return x.key === selection.style; })[0] || {}).label, selection.diameter ].filter(Boolean).join(' · ')
          : (selection[s.key] || ''))
        : '';
      copy.appendChild(title);
      copy.appendChild(val);
      row.appendChild(num);
      row.appendChild(copy);
      if (isPast) {
        row.addEventListener('click', function(){ current = i; render(true); });
      }
      stepperEl.appendChild(row);
    });
  }

  function renderOptionStep(step){
    var wrap = document.createElement('div');
    var eyebrow = document.createElement('p');
    eyebrow.className = 'panel-heading';
    eyebrow.textContent = 'Шаг ' + (current + 1) + ' из ' + (STEPS.length - 1);
    var q = document.createElement('h2');
    q.className = 'panel-question';
    q.textContent = step.question;

    wrap.appendChild(eyebrow);
    wrap.appendChild(q);

    var isBrandPhoto = step.key === 'brand';
    var isDiskStep = step.key === 'disk';

    if (isDiskStep){
      wrap.appendChild(buildDiskStepBody());
      return wrap;
    }

    if (isBrandPhoto){
      var searchWrap = document.createElement('div');
      searchWrap.className = 'brand-search';
      var searchInput = document.createElement('input');
      searchInput.type = 'text';
      searchInput.placeholder = 'Поиск марки...';
      searchInput.id = 'fzCfgBrandSearch';
      searchWrap.appendChild(searchInput);
      wrap.appendChild(searchWrap);
    }

    var grid = document.createElement('div');
    grid.className = 'option-grid';

    step.options.forEach(function(opt){
      var card = document.createElement('div');
      card.className = 'option-card' +
        (isBrandPhoto ? ' photo' : '') +
        (selection[step.key] === opt.v ? ' selected' : '');
      card.tabIndex = 0;
      if (isBrandPhoto){
        card.setAttribute('data-brand', opt.v.toLowerCase());
        if (opt.other) card.setAttribute('data-other', '1');
      }

      if (isBrandPhoto){
        var photoUrl = BRAND_PHOTOS[opt.v];
        var bg = document.createElement('div');
        if (photoUrl){
          bg.className = 'photo-bg logo-bg';
          var lim = document.createElement('img');
          lim.alt = opt.v; lim.decoding = 'async'; lim.src = photoUrl;
          lim.onload = function(){ fzLogoSize(this); };
          bg.appendChild(lim);
        } else {
          bg.className = 'photo-bg placeholder';
          var pg = document.createElement('span');
          pg.className = 'photo-placeholder-glyph';
          pg.textContent = opt.other ? '+' : opt.v.replace(/[^A-ZА-Я]/gi,'').slice(0,2).toUpperCase();
          bg.appendChild(pg);
        }
        var overlay = document.createElement('div');
        overlay.className = 'photo-overlay';
        var label = document.createElement('div');
        label.className = 'option-label';
        label.textContent = opt.v;
        overlay.appendChild(label);
        card.appendChild(bg);
        card.appendChild(overlay);
      } else {
        var glyph = document.createElement('div');
        glyph.className = 'option-glyph';
        glyph.textContent = opt.v.replace(/[^A-ZА-Я]/gi,'').slice(0,2).toUpperCase();
        var label2 = document.createElement('div');
        label2.className = 'option-label';
        label2.textContent = opt.v;
        card.appendChild(glyph);
        card.appendChild(label2);
      }

      function choose(){
        selection[step.key] = opt.v;
        var shouldAdvance = step.key === 'diameter' || (step.key === 'brand' && !opt.other);
        if (shouldAdvance && current < STEPS.length - 1) {
          current += 1;
        }
        render(shouldAdvance);
      }
      card.addEventListener('click', choose);
      card.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); choose(); } });
      grid.appendChild(card);
    });

    wrap.appendChild(grid);

    if (isBrandPhoto){
      searchInput.addEventListener('input', function(){
        var q = searchInput.value.trim().toLowerCase();
        grid.querySelectorAll('.option-card').forEach(function(card){
          var name = card.getAttribute('data-brand') || '';
          var isOther = card.getAttribute('data-other') === '1';
          card.style.display = (!q || name.indexOf(q) > -1 || isOther) ? '' : 'none';
        });
      });
    }

    var selectedOpt = step.options.find(function(o){ return o.v === selection[step.key]; });
    if (selectedOpt && selectedOpt.other){
      var otherBox = document.createElement('div');
      otherBox.className = 'other-input';
      var otherLabel = document.createElement('label');
      otherLabel.textContent = 'Напишите вашу марку и модель';
      var otherInput = document.createElement('input');
      otherInput.type = 'text';
      otherInput.placeholder = 'Например, Genesis GV80';
      otherInput.value = selection.brandOther || '';
      otherInput.addEventListener('input', function(){
        selection.brandOther = otherInput.value;
        btnNext.disabled = !selection.brandOther.trim();
      });
      otherBox.appendChild(otherLabel);
      otherBox.appendChild(otherInput);
      wrap.appendChild(otherBox);
    }

    return wrap;
  }

  function buildDiskStepBody(){
    var wrap = document.createElement('div');

    var allowed = allowedStyles(selection.brand === 'Другая марка' ? null : selection.brand);

    var grid = document.createElement('div');
    grid.className = 'option-grid style-grid';
    DISK_STYLES.forEach(function(st){
      var isAllowed = allowed.indexOf(st.key) !== -1;
      var card = document.createElement('div');
      card.className = 'option-card photo' + (!isAllowed ? ' disabled' : (selection.style === st.key ? ' selected' : ''));
      card.tabIndex = isAllowed ? 0 : -1;
      var photoUrl = STYLE_PHOTOS[st.key];
      var bg = document.createElement('div');
      bg.className = 'photo-bg';
      bg.style.backgroundImage = "url('" + (photoUrl.indexOf('tildacdn.pro') !== -1 ? resizeUrl(photoUrl, 400) : photoUrl) + "')";
      var overlay = document.createElement('div');
      overlay.className = 'photo-overlay';
      var label = document.createElement('div');
      label.className = 'option-label';
      label.textContent = st.label;
      var sub = document.createElement('div');
      sub.className = 'option-sub';
      sub.innerHTML = isAllowed ? st.sub : '<b>недоступно</b> для этой марки';
      overlay.appendChild(label);
      overlay.appendChild(sub);
      card.appendChild(bg);
      card.appendChild(overlay);
      function choose(){
        if (!isAllowed) return;
        selection.style = st.key;
        render(false);
      }
      card.addEventListener('click', choose);
      card.addEventListener('keydown', function(e){ if (isAllowed && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); choose(); } });
      grid.appendChild(card);
    });
    wrap.appendChild(grid);

    var diamPanel = document.createElement('div');
    diamPanel.className = 'diam-panel';
    var diamHead = document.createElement('div');
    diamHead.className = 'diam-panel__head';
    var diamLabel = document.createElement('div');
    diamLabel.className = 'diam-panel__label';
    diamLabel.textContent = 'Диаметр диска';
    var diamValue = document.createElement('div');
    diamValue.className = 'diam-panel__value';
    diamValue.textContent = selection.diameter || '';
    diamHead.appendChild(diamLabel);
    diamHead.appendChild(diamValue);
    var chips = document.createElement('div');
    chips.className = 'diam-chips';
    STEPS.filter(function(s){ return s.key === 'disk'; })[0].options.forEach(function(opt){
      var chip = document.createElement('div');
      chip.className = 'diam-chip' + (selection.diameter === opt.v ? ' selected' : '');
      chip.textContent = opt.v;
      chip.tabIndex = 0;
      function chooseDiam(){
        selection.diameter = opt.v;
        render(false);
      }
      chip.addEventListener('click', chooseDiam);
      chip.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); chooseDiam(); } });
      chips.appendChild(chip);
    });
    diamPanel.appendChild(diamHead);
    diamPanel.appendChild(chips);
    wrap.appendChild(diamPanel);

    return wrap;
  }

  function buildWhatsappUrl(){
    var brandLine = selection.brand === 'Другая марка'
      ? (selection.brandOther || 'Другая марка')
      : selection.brand;
    var lines = ['Здравствуйте! Хочу подобрать диски через конфигуратор на сайте.'];
    lines.push('Марка авто: ' + (brandLine || '—'));
    var styleObj = DISK_STYLES.filter(function(x){ return x.key === selection.style; })[0];
    lines.push('Стиль диска: ' + (styleObj ? styleObj.label : '—'));
    lines.push('Диаметр: ' + (selection.diameter || '—'));
    var name = (document.getElementById('fzCfgName') || {}).value;
    var phone = (document.getElementById('fzCfgPhone') || {}).value;
    var wishes = (document.getElementById('fzCfgWishes') || {}).value;
    if (name) lines.push('Имя: ' + name);
    if (phone) lines.push('Телефон: ' + phone);
    if (wishes) lines.push('Пожелания: ' + wishes);
    return 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(lines.join('\n'));
  }

  function renderLeadStep(){
    var wrap = document.createElement('div');

    if (submitted){
      var ok = document.createElement('div');
      ok.className = 'success-panel';
      ok.innerHTML = '<div class="success-glyph">✓</div>' +
        '<h2 class="success-title">Заявка сформирована</h2>' +
        '<p class="success-text">Мы открыли WhatsApp с уже заполненным сообщением — просто нажмите «Отправить» в чате, и наш менеджер свяжется с вами.</p>';
      wrap.appendChild(ok);
      return wrap;
    }

    var eyebrow = document.createElement('p');
    eyebrow.className = 'panel-heading';
    eyebrow.textContent = 'Последний шаг';
    var q = document.createElement('h2');
    q.className = 'panel-question';
    q.textContent = 'Проверьте параметры и оставьте заявку';
    wrap.appendChild(eyebrow);
    wrap.appendChild(q);

    var brandValue = selection.brand === 'Другая марка'
      ? (selection.brandOther || 'Другая марка') + ' (другая марка)'
      : selection.brand;

    var styleObjLead = DISK_STYLES.filter(function(x){ return x.key === selection.style; })[0];
    var card = document.createElement('dl');
    card.className = 'summary-card';
    [['brandDisplay','Марка авто'],['styleDisplay','Стиль диска'],['diameter','Диаметр']].forEach(function(pair){
      var row = document.createElement('div');
      row.className = 'summary-row';
      var dt = document.createElement('dt');
      dt.textContent = pair[1];
      var dd = document.createElement('dd');
      dd.textContent = (pair[0] === 'brandDisplay' ? brandValue : pair[0] === 'styleDisplay' ? (styleObjLead ? styleObjLead.label : '') : selection[pair[0]]) || '—';
      row.appendChild(dt);
      row.appendChild(dd);
      card.appendChild(row);
    });
    wrap.appendChild(card);

    var formGrid = document.createElement('div');
    formGrid.className = 'form-grid';
    formGrid.innerHTML =
      '<div class="field"><label>Ваше имя</label><input type="text" id="fzCfgName" placeholder="Например, Асхат" /></div>' +
      '<div class="field"><label>Телефон</label><input type="tel" id="fzCfgPhone" placeholder="+7 700 000 00 00" /></div>' +
      '<div class="field field-full"><label>Пожелания <span class="field-optional">(необязательно)</span></label>' +
      '<textarea id="fzCfgWishes" placeholder="Например: хочу цвет в тон кузова"></textarea></div>';
    wrap.appendChild(formGrid);

    return wrap;
  }

  var appEl = document.getElementById('fzCfgApp');

  function render(scrollToTop){
    if (bodyEl.contains(document.activeElement)) { document.activeElement.blur(); }

    var step = STEPS[current];
    bodyEl.innerHTML = '';
    bodyEl.appendChild(step.key === 'lead' ? renderLeadStep() : renderOptionStep(step));
    renderStepper();

    btnBack.style.visibility = current === 0 ? 'hidden' : 'visible';

    if (step.key === 'lead'){
      btnNext.textContent = submitted ? 'Начать заново' : 'Отправить в WhatsApp';
      btnNext.disabled = false;
    } else {
      btnNext.textContent = 'Далее';
      var hasValue = step.key === 'disk' ? !!(selection.style && selection.diameter) : !!selection[step.key];
      var needsOther = step.key === 'brand' && selection.brand === 'Другая марка';
      btnNext.disabled = !hasValue || (needsOther && !(selection.brandOther || '').trim());
    }

    if (scrollToTop && appEl) {
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          setTimeout(function(){
            appEl.scrollIntoView({ behavior: 'instant', block: 'start' });
          }, 60);
        });
      });
    }
  }

  btnBack.addEventListener('click', function(){
    if (current > 0){ current -= 1; render(true); }
  });

  btnNext.addEventListener('click', function(){
    var step = STEPS[current];
    if (step.key === 'lead'){
      if (submitted){
        selection = {};
        submitted = false;
        current = 0;
        render(true);
      } else {
        window.open(buildWhatsappUrl(), '_blank');
        submitted = true;
        render(true);
      }
      return;
    }
    if (current < STEPS.length - 1){
      current += 1;
      render(true);
    }
  });

  render();
})();
