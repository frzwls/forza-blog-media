<style>
/* FZ-PODBORKI: подборки дисков под модель авто (данные: forza-blog-media/data/podborki.json) */
.fzpb{--bg:#131313;--line:#2b2b2b;--text:#f4f2ef;--dim:#9b9793;--accent:#b3332b;position:relative;width:100vw;margin-left:calc(-50vw + 50%);background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;padding:80px 0 70px;box-sizing:border-box}
.fzpb *{box-sizing:border-box}
.fzpb[hidden]{display:none}
.fzpb__head{width:min(1200px,calc(100% - 48px));margin:0 auto 34px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.fzpb__eyebrow{display:flex;align-items:center;gap:12px;color:var(--accent);font:700 11px Inter,Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
.fzpb__eyebrow:before{content:"";width:26px;height:1px;background:var(--accent)}
.fzpb__title{font:800 40px/1.1 Inter,Arial,sans-serif;letter-spacing:-.02em;margin:0;color:var(--text)}
.fzpb__sub{margin:12px 0 0;color:var(--dim);font-size:15px;max-width:600px;line-height:1.5}
.fzpb__ctrl{display:flex;gap:10px}
.fzpb__arrow{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;font-size:18px;transition:.2s}
.fzpb__arrow:hover{background:var(--accent);border-color:var(--accent)}
.fzpb__track{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 max(24px,calc((100% - 1200px)/2)) 6px;scrollbar-width:none;scroll-behavior:smooth;scroll-padding:0 max(24px,calc((100% - 1200px)/2))}
.fzpb__track::-webkit-scrollbar{display:none}
.fzpb__card{flex:0 0 340px;height:440px;border-radius:20px;overflow:hidden;position:relative;scroll-snap-align:start;cursor:pointer;background:#1c1c1c;border:0;padding:0;text-align:left;color:inherit}
.fzpb__card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.fzpb__card:hover img{transform:scale(1.05)}
.fzpb__card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.72),rgba(0,0,0,0) 45%,rgba(0,0,0,.35))}
.fzpb__ct{position:absolute;z-index:2;left:22px;right:22px;top:20px}
.fzpb__ct b{display:block;font:700 22px/1.15 Inter,Arial,sans-serif;letter-spacing:-.01em}
.fzpb__ct span{display:block;margin-top:6px;font:500 14px Inter,Arial,sans-serif;color:rgba(255,255,255,.82)}
.fzpb__cz{position:absolute;z-index:2;left:22px;bottom:20px;padding:8px 14px;border-radius:30px;background:rgba(10,10,10,.7);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);font:600 12px Inter,Arial,sans-serif;letter-spacing:.04em}
.fzpb__go{position:absolute;z-index:2;right:20px;bottom:18px;width:40px;height:40px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px;opacity:0;transform:translateY(6px);transition:.25s}
.fzpb__card:hover .fzpb__go{opacity:1;transform:none}
.fzpb__more{width:min(1200px,calc(100% - 48px));margin:32px auto 0}
.fzpb__more a{display:inline-block;padding:15px 30px;border:1px solid var(--line);border-radius:10px;color:var(--text);text-decoration:none;font:700 12px Inter,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;transition:.2s}
.fzpb__more a:hover{border-color:var(--accent);background:rgba(179,51,43,.12)}
.fzpb-lb{position:fixed;inset:0;z-index:99990;background:rgba(5,5,5,.92);display:none;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto;font-family:Inter,Arial,sans-serif;color:#f4f2ef}
.fzpb-lb.on{display:flex}
.fzpb-lb *{box-sizing:border-box}
.fzpb-lb__box{position:relative;margin:auto;width:min(1080px,100%);display:grid;grid-template-columns:1.4fr 1fr;background:#0e0e0e;border:1px solid #222;border-radius:20px;overflow:hidden}
.fzpb-lb__img{position:relative;background:#000;min-height:380px}
.fzpb-lb__img img{width:100%;height:100%;object-fit:cover;display:block;max-height:62vh}
.fzpb-lb__a{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:18px}
.fzpb-lb__a.p{left:14px}.fzpb-lb__a.n{right:14px}
.fzpb-lb__cnt{position:absolute;left:14px;bottom:14px;padding:6px 12px;border-radius:20px;background:rgba(0,0,0,.65);font:600 12px Inter,Arial,sans-serif}
.fzpb-lb__side{padding:26px;display:flex;flex-direction:column;gap:14px}
.fzpb-lb__side h4{font:800 26px/1.15 Inter,Arial,sans-serif;margin:0;color:#f4f2ef}
.fzpb-lb__meta{color:#9b9793;font-size:14px}
.fzpb-lb__chips{display:flex;gap:8px;flex-wrap:wrap}
.fzpb-lb__chips span{padding:7px 12px;border:1px solid #2b2b2b;border-radius:30px;font:600 12px Inter,Arial,sans-serif}
.fzpb-lb__thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.fzpb-lb__thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;opacity:.55;cursor:pointer;border:2px solid transparent}
.fzpb-lb__thumbs img.on{opacity:1;border-color:#b3332b}
.fzpb-lb__btn{margin-top:auto;display:block;text-align:center;padding:16px;border-radius:10px;background:#b3332b;color:#fff;text-decoration:none;font:700 12px Inter,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}
.fzpb-lb__btn.g{background:transparent;border:1px solid #2b2b2b;margin-top:0}
.fzpb-lb__x{position:absolute;top:14px;right:14px;z-index:3;width:42px;height:42px;border-radius:50%;border:0;background:#1c1c1c;color:#fff;font-size:18px;cursor:pointer}
.fzpb-lb__wheels{grid-column:1/-1;padding:28px 28px 34px;border-top:1px solid #222;background:#0b0b0b}
.fzpb-lb__wh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px}
.fzpb-lb__wh h5{font:800 24px Inter,Arial,sans-serif;margin:0;color:#f4f2ef}.fzpb-lb__wh span{color:#9b9793;font-size:14px}
.fzpb-lb__gt{display:flex;align-items:center;gap:12px;margin:26px 0 14px;font:800 16px Inter,Arial,sans-serif;letter-spacing:.02em}
.fzpb-lb__gt:first-child{margin-top:0}
.fzpb-lb__gt:before{content:"";width:3px;height:18px;background:#b3332b;border-radius:2px}
.fzpb-lb__gt span{padding:3px 10px;border-radius:20px;background:#1c1c1c;border:1px solid #2b2b2b;font:700 12px Inter,Arial,sans-serif;color:#9b9793}
.fzpb-lb__grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.fzpb-lb__wc{display:block;text-decoration:none;color:#f4f2ef;background:#141414;border:1px solid #222;border-radius:14px;overflow:hidden;transition:.2s}
.fzpb-lb__wc:hover{border-color:#b3332b;transform:translateY(-3px)}
.fzpb-lb__wc img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#1a1a1a}
.fzpb-lb__wc div{padding:12px 14px 14px}
.fzpb-lb__wc b{display:block;font:700 13px/1.3 Inter,Arial,sans-serif}
.fzpb-lb__wc i{display:block;margin-top:6px;font:600 11px Inter,Arial,sans-serif;color:#b3332b;font-style:normal;letter-spacing:.08em;text-transform:uppercase}
.fzpb-lb__all{display:inline-block;margin-top:16px;padding:12px 22px;border:1px solid #2b2b2b;border-radius:10px;color:#f4f2ef;text-decoration:none;font:700 12px Inter,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.fzpb-lb__all:hover{border-color:#b3332b}
@media(max-width:900px){.fzpb-lb__grid{grid-template-columns:repeat(2,1fr)}.fzpb-lb__box{grid-template-columns:1fr}}
@media(max-width:760px){.fzpb{padding:56px 0 48px}.fzpb__title{font-size:28px}.fzpb__ctrl{display:none}.fzpb__card{flex-basis:78%;height:400px}.fzpb-lb{padding:12px}.fzpb-lb__img{min-height:240px}.fzpb-lb__img img{max-height:44vh}.fzpb-lb__wheels{padding:22px 16px 26px}}
</style>
<section class="fzpb" id="fzpb" hidden>
  <div class="fzpb__head">
    <div>
      <div class="fzpb__eyebrow">Подборки по моделям</div>
      <h2 class="fzpb__title">Подборки дисков под ваш автомобиль</h2>
      <p class="fzpb__sub">Выберите свою модель - откроется подборка: наш проект на этой машине и дизайны дисков, которые подходят именно ей.</p>
    </div>
    <div class="fzpb__ctrl"><button class="fzpb__arrow" id="fzpbP" aria-label="Назад">←</button><button class="fzpb__arrow" id="fzpbN" aria-label="Вперёд">→</button></div>
  </div>
  <div class="fzpb__track" id="fzpbT"></div>
  <div class="fzpb__more"><a href="/catalog">Весь каталог →</a></div>
</section>
<div class="fzpb-lb" id="fzpbLb"><div class="fzpb-lb__box"><button class="fzpb-lb__x" id="fzpbX" aria-label="Закрыть">✕</button>
  <div class="fzpb-lb__img"><img id="fzpbI" alt=""><button class="fzpb-lb__a p" id="fzpbLP">←</button><button class="fzpb-lb__a n" id="fzpbLN">→</button><div class="fzpb-lb__cnt" id="fzpbC"></div></div>
  <div class="fzpb-lb__side"><h4 id="fzpbH"></h4><div class="fzpb-lb__meta" id="fzpbM"></div><div class="fzpb-lb__chips" id="fzpbCh"></div><div class="fzpb-lb__thumbs" id="fzpbTh"></div>
    <a class="fzpb-lb__btn" href="/wheel-configurator">Подобрать под мою машину</a><a class="fzpb-lb__btn g" id="fzpbPr" href="/cars-gallery">Смотреть проект →</a></div>
  <div class="fzpb-lb__wheels"><div class="fzpb-lb__wh"><h5 id="fzpbWT"></h5><span id="fzpbWN"></span></div><div id="fzpbW"></div></div></div></div>
<script>
(function(){
  var DATA_URL='https://raw.githubusercontent.com/frzwls/forza-blog-media/main/data/podborki.json';
  var $=function(id){return document.getElementById(id)};
  var sec=$('fzpb'),tr=$('fzpbT'),lb=$('fzpbLb');
  if(!sec||!tr||!lb) return;
  // окно держим в body, чтобы оно не зависело от обёрток Tilda
  document.body.appendChild(lb);
  var C=[],cur=0,k=0;
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function plural(n){var a=n%10,b=n%100;if(a===1&&b!==11)return 'дизайн';if(a>=2&&a<=4&&(b<10||b>=20))return 'дизайна';return 'дизайнов'}
  function build(){
    C.forEach(function(c,i){
      var b=document.createElement('button');b.type='button';b.className='fzpb__card';
      b.innerHTML='<img src="'+esc(c.thumb)+'" alt="'+esc(c.t)+'" loading="lazy"><span class="fzpb__ct"><b>'+esc(c.t)+'</b><span>'+esc(c.s)+'</span></span><span class="fzpb__cz">Подборка · '+c.n+' '+plural(c.n)+'</span><span class="fzpb__go">→</span>';
      b.onclick=function(){openCar(i)};tr.appendChild(b);
    });
    sec.hidden=false;
  }
  function show(){
    var c=C[cur];$('fzpbI').src=c.imgs[k];$('fzpbC').textContent=(k+1)+' / '+c.imgs.length;
    [].forEach.call($('fzpbTh').children,function(x,j){x.className=j===k?'on':''});
  }
  function allLink(name){return name.indexOf('Заводские')===0?'/oem':(name.indexOf('Магниевые')===0?'/magnesium':'/catalog')}
  function openCar(i){
    cur=i;k=0;var c=C[i];
    $('fzpbH').textContent=c.t;$('fzpbM').textContent=c.s;
    $('fzpbCh').innerHTML='<span>Подборка: '+c.n+' '+plural(c.n)+'</span><span>Любой размер и цвет</span><span>Пожизненная гарантия</span>';
    var th=$('fzpbTh');th.innerHTML='';
    c.imgs.forEach(function(u,j){var im=document.createElement('img');im.src=u.replace('/resize/1200x/','/resize/200x/');im.alt='';im.onclick=function(){k=j;show()};th.appendChild(im)});
    $('fzpbPr').href=c.proj;
    $('fzpbWT').textContent='Подборка дисков: '+c.t;$('fzpbWN').textContent='Дизайнов в подборке: '+c.n;
    var w=$('fzpbW');w.innerHTML='';
    c.g.forEach(function(g){
      var h=document.createElement('div');h.className='fzpb-lb__gt';h.innerHTML=esc(g.n)+'<span>'+g.tot+'</span>';w.appendChild(h);
      var gr=document.createElement('div');gr.className='fzpb-lb__grid';
      g.x.forEach(function(x){var a=document.createElement('a');a.className='fzpb-lb__wc';a.href=x.u;a.innerHTML='<img loading="lazy" src="'+esc(x.i)+'" alt=""><div><b>'+esc(x.l)+'</b><i>'+esc(x.z)+'</i></div>';gr.appendChild(a)});
      w.appendChild(gr);
      if(g.tot>g.x.length){var m=document.createElement('a');m.className='fzpb-lb__all';m.href=allLink(g.n);m.textContent='Смотреть все '+g.tot+' →';w.appendChild(m)}
    });
    lb.classList.add('on');lb.scrollTop=0;document.documentElement.style.overflow='hidden';show();
  }
  function close(){lb.classList.remove('on');document.documentElement.style.overflow=''}
  $('fzpbX').onclick=close;lb.onclick=function(e){if(e.target===lb)close()};
  $('fzpbLN').onclick=function(){k=(k+1)%C[cur].imgs.length;show()};
  $('fzpbLP').onclick=function(){k=(k-1+C[cur].imgs.length)%C[cur].imgs.length;show()};
  $('fzpbN').onclick=function(){tr.scrollBy({left:360})};$('fzpbP').onclick=function(){tr.scrollBy({left:-360})};
  document.addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return;if(e.key==='Escape')close();if(e.key==='ArrowRight')$('fzpbLN').click();if(e.key==='ArrowLeft')$('fzpbLP').click()});
  // данные: с GitHub, кеш на час; при ошибке блок остаётся скрытым
  var t=Math.floor(Date.now()/3600000);
  fetch(DATA_URL+'?t='+t).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){C=(d&&d.cars)||[];if(C.length)build()}).catch(function(){});
})();
</script>
