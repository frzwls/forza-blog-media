<style>
/* FZ-GALFILTER: фильтр галереи Марка -> Модель -> Диски (данные: forza-blog-media/data/gallery-filter.json) */
.fzgf{--bg:#131313;--line:#2b2b2b;--text:#f4f2ef;--dim:#9b9793;--accent:#b3332b;position:relative;margin:0 0 26px;font-family:Inter,Arial,sans-serif;color:var(--text);box-sizing:border-box}
.fzgf *{box-sizing:border-box}
.fzgf[hidden]{display:none}
.fzgf__bar{display:flex;border:1px solid var(--line);border-radius:16px;background:#181818;overflow:hidden}
.fzgf__f{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px;height:62px;padding:0 20px;background:none;border:0;border-left:1px solid var(--line);color:var(--text);font:500 15px Inter,Arial,sans-serif;text-align:left;cursor:pointer;transition:background .2s}
.fzgf__f:first-child{border-left:0}
.fzgf__f:hover{background:#1f1f1f}
.fzgf__f[hidden]{display:none}
.fzgf__f.ph .fzgf__v{color:var(--dim)}
.fzgf__v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fzgf__ic{flex:none;width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.fzgf__ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fzgf__f:not(.ph) .fzgf__ic{border-radius:50%;color:var(--text)}
.fzgf__f:not(.ph) .fzgf__ic:hover{background:#2b2b2b}
.fzgf__cnt{margin:12px 2px 0;color:var(--dim);font-size:13px}
.fzgf-m{position:fixed;inset:0;z-index:100010;background:rgba(5,5,5,.9);display:none;align-items:center;justify-content:center;padding:24px;font-family:Inter,Arial,sans-serif;color:#f4f2ef}
.fzgf-m.on{display:flex}
.fzgf-m *{box-sizing:border-box}
.fzgf-m__box{width:min(1120px,100%);max-height:86vh;display:flex;flex-direction:column;background:#131313;border:1px solid #2b2b2b;border-radius:20px;overflow:hidden}
.fzgf-m__top{display:flex;gap:14px;align-items:center;padding:18px 20px;border-bottom:1px solid #2b2b2b}
.fzgf-m__s{flex:1;height:46px;padding:0 16px;border-radius:12px;border:1px solid #2b2b2b;background:#1a1a1a;color:#f4f2ef;font:500 15px Inter,Arial,sans-serif;outline:0}
.fzgf-m__s::placeholder{color:#9b9793}
.fzgf-m__s:focus{border-color:#555}
.fzgf-m__x{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:#1f1f1f;color:#fff;font-size:18px;cursor:pointer}
.fzgf-m__x:hover{background:var(--accent,#b3332b)}
.fzgf-m__g{padding:22px 20px 28px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.fzgf-m__g.mod{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.fzgf-m__i{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 10px 14px;border-radius:14px;border:1px solid transparent;background:transparent;color:#f4f2ef;font:600 14px/1.25 Inter,Arial,sans-serif;text-align:center;cursor:pointer;transition:.2s}
.fzgf-m__i:hover{background:#1c1c1c;border-color:#2b2b2b}
.fzgf-m__i img.lg{width:64px;height:64px;object-fit:contain;filter:brightness(0) invert(1);opacity:.92}
.fzgf-m__i .ph{width:64px;height:64px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#1f1f1f;font:800 22px Inter,Arial,sans-serif;color:#9b9793}
.fzgf-m__i img.pic{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:#1c1c1c}
.fzgf-m__i img.dsk{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#1c1c1c}
.fzgf-m__i small{display:block;margin-top:3px;color:#9b9793;font:500 12px Inter,Arial,sans-serif}
.fzgf-m__e{grid-column:1/-1;padding:30px 0;text-align:center;color:#9b9793;font:500 15px Inter,Arial,sans-serif}
.fzgf-chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;justify-content:center}
.fzgf-chip{display:inline-flex;align-items:center;gap:9px;padding:5px 14px 5px 5px;border-radius:30px;border:1px solid #2b2b2b;background:#181818;color:#f4f2ef;font:600 13px Inter,Arial,sans-serif;cursor:pointer;transition:.2s}
.fzgf-chip:hover{border-color:#b3332b;background:rgba(179,51,43,.12)}
.fzgf-chip i{width:30px;height:30px;border-radius:50%;background:#222 center/cover no-repeat;flex:none}
.fzgf-hide{display:none!important}
.fzgf-d{position:fixed;inset:0;z-index:100020;background:rgba(5,5,5,.94);display:none;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto;font-family:Inter,Arial,sans-serif;color:#f4f2ef}
.fzgf-d.on{display:flex}
.fzgf-d *{box-sizing:border-box}
.fzgf-d__box{position:relative;margin:auto;width:min(960px,100%);display:grid;grid-template-columns:1.2fr 1fr;background:#0e0e0e;border:1px solid #222;border-radius:20px;overflow:hidden}
.fzgf-d__img{position:relative;background:#1a1a1a;min-height:380px}
.fzgf-d__img img{width:100%;height:100%;object-fit:cover;display:block;max-height:70vh}
.fzgf-d__a{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:18px}
.fzgf-d__a.p{left:14px}.fzgf-d__a.n{right:14px}
.fzgf-d__cnt{position:absolute;left:14px;bottom:14px;padding:6px 12px;border-radius:20px;background:rgba(0,0,0,.65);font:600 12px Inter,Arial,sans-serif}
.fzgf-d__side{padding:28px 26px;display:flex;flex-direction:column;gap:14px}
.fzgf-d__tag{align-self:flex-start;padding:6px 12px;border-radius:20px;background:rgba(179,51,43,.15);border:1px solid rgba(179,51,43,.4);color:#e0645c;font:700 11px Inter,Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.fzgf-d__side h4{font:800 24px/1.2 Inter,Arial,sans-serif;margin:0;padding-right:50px;color:#f4f2ef}
.fzgf-d__sz{font:600 13px/1.5 Inter,Arial,sans-serif;color:#d8d5d0}
.fzgf-d__th{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.fzgf-d__th img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;opacity:.55;cursor:pointer;border:2px solid transparent}
.fzgf-d__th img.on{opacity:1;border-color:#b3332b}
.fzgf-d__btns{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.fzgf-d__btn{display:block;text-align:center;padding:16px;border-radius:10px;background:#b3332b;color:#fff;text-decoration:none;font:700 12px Inter,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;border:0;cursor:pointer;width:100%}
.fzgf-d__btn.g{background:transparent;border:1px solid #2b2b2b;color:#f4f2ef}
.fzgf-d__x{position:absolute;top:14px;right:14px;z-index:3;width:42px;height:42px;border-radius:50%;border:0;background:#1c1c1c;color:#fff;font-size:18px;cursor:pointer}
@media(max-width:900px){.fzgf__bar{flex-direction:column}.fzgf__f{border-left:0;border-top:1px solid var(--line);height:56px}.fzgf__f:first-child{border-top:0}.fzgf-d__box{grid-template-columns:1fr}.fzgf-d__img{min-height:240px}.fzgf-d__img img{max-height:46vh}.fzgf-m{padding:0;align-items:stretch}.fzgf-m__box{max-height:none;border-radius:0;width:100%}.fzgf-m__g{grid-template-columns:repeat(2,1fr)}.fzgf-m__g.mod{grid-template-columns:1fr}}
@media(max-width:760px){.fzgf-d{padding:12px}}
</style>
<div class="fzgf" id="fzgf" hidden>
  <div class="fzgf__bar">
    <button type="button" class="fzgf__f ph" id="fzgfB"><span class="fzgf__v">Марка</span><span class="fzgf__ic"></span></button>

</div>
<div class="fzgf-m" id="fzgfMo"><div class="fzgf-m__box"><div class="fzgf-m__top"><input class="fzgf-m__s" id="fzgfS" type="text" placeholder="Поиск..." autocomplete="off"><button type="button" class="fzgf-m__x" id="fzgfMx" aria-label="Закрыть">✕</button></div><div class="fzgf-m__g" id="fzgfG"></div></div></div>
<div class="fzgf-d" id="fzgfDo"><div class="fzgf-d__box"><button type="button" class="fzgf-d__x" id="fzgfDx" aria-label="Закрыть">✕</button>
  <div class="fzgf-d__img"><img id="fzgfDi" alt=""><button type="button" class="fzgf-d__a p" id="fzgfDp">←</button><button type="button" class="fzgf-d__a n" id="fzgfDn">→</button><div class="fzgf-d__cnt" id="fzgfDc"></div></div>
  <div class="fzgf-d__side"><span class="fzgf-d__tag">Диск на этой машине</span><h4 id="fzgfDh"></h4><div class="fzgf-d__sz" id="fzgfDs"></div><div class="fzgf-d__th" id="fzgfDt"></div>
    <div class="fzgf-d__btns"><a class="fzgf-d__btn" id="fzgfDw" href="#" target="_blank" rel="noopener">Заказать такие диски в WhatsApp</a><button type="button" class="fzgf-d__btn g" id="fzgfDa">Показать все проекты с этим диском</button><button type="button" class="fzgf-d__btn g" id="fzgfDb">Закрыть</button></div></div></div></div>
<script>
(function(){
  var DATA_URL='https://raw.githubusercontent.com/frzwls/forza-blog-media/main/data/gallery-filter.json';
  var LOGO='https://cdn.jsdelivr.net/gh/frzwls/forza-blog-media@85f3e00/assets/cfg-logos/';
  var $=function(id){return document.getElementById(id)};
  var root=$('fzgf'),mo=$('fzgfMo'),dov=$('fzgfDo');
  if(!root||!mo||!dov)return;
  document.body.appendChild(mo);document.body.appendChild(dov);
  var D=null,st={b:'',m:'',d:''},modal='',CHEV='<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',XI='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  function pl(n){var a=n%10,b=n%100;return n+' '+(a===1&&b!==11?'проект':(a>=2&&a<=4&&(b<10||b>=20)?'проекта':'проектов'))}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function brandObj(k){for(var i=0;i<D.brands.length;i++)if(D.brands[i].k===k)return D.brands[i]}
  function models(){return (D&&st.b&&D.models[st.b])||null}
  function modelObj(id){var ms=models()||[];for(var i=0;i<ms.length;i++)if(ms[i].id===id)return ms[i]}
  /* ---- левый фильтр (его панель остаётся) ---- */
  function leftOpts(){return [].slice.call(document.querySelectorAll('.fz-gcf__opt'))}
  function leftChecked(){return leftOpts().filter(function(l){var i=l.querySelector('input');return i&&i.checked})}
  function leftReset(){var b=[].slice.call(document.querySelectorAll('.fz-gcf button')).filter(function(x){return /Сбросить/i.test(x.textContent)})[0];if(b)b.click()}
  function leftPick(k){leftReset();setTimeout(function(){var l=leftOpts().filter(function(x){return x.getAttribute('data-brand')===k})[0];if(l&&!(l.querySelector('input')||{}).checked)l.click();setTimeout(apply,350)},120)}
  /* ---- поля фильтра ---- */
  function field(btn,val,ph){
    var f=$(btn);f.classList.toggle('ph',!val);f.querySelector('.fzgf__v').textContent=val||ph;
    var ic=f.querySelector('.fzgf__ic');ic.innerHTML=val?XI:CHEV;
  }
  function render(){
    if(!D)return;
    var b=st.b?brandObj(st.b):null;field('fzgfB',b?b.n:'','Марка');
    var ms=models();$('fzgfM').hidden=!ms;
    var mo_=st.m?modelObj(st.m):null;field('fzgfM',mo_?mo_.t:'','Модель');
    $('fzgfD').hidden=!(mo_&&mo_.d.length);
    var dk=st.d?D.disks[st.d]:null;field('fzgfD',dk?(dk.z+' · '+dk.l):'','Диски');
    var c=$('fzgfC');
    if(st.m||st.d){var n=visibleCount();c.hidden=false;c.textContent='Проектов: '+n}else c.hidden=true;
  }
  function visibleCount(){return [].slice.call(document.querySelectorAll('.js-product')).filter(function(c){return c.offsetParent!==null}).length}
  /* ---- фильтрация карточек по модели/диску ---- */
  function allowed(){
    if(!st.m&&!st.d)return null;
    var m=st.m?modelObj(st.m):null,set={};
    if(st.d){for(var u in D.pairs){if(D.pairs[u].indexOf(st.d)>-1&&(!m||m.u.indexOf(u)>-1))set[u]=1}}
    else if(m){m.u.forEach(function(u){set[u]=1})}
    return set;
  }
  function apply(){
    if(!D)return;
    var set=allowed();
    [].forEach.call(document.querySelectorAll('.js-product'),function(c){
      var u=c.getAttribute('data-product-uid');
      c.classList.toggle('fzgf-hide',!!(set&&!set[u]));
    });
    render();
  }
  /* ---- метки «диск» на карточках ---- */
  function chips(){
    if(!D)return;
    [].forEach.call(document.querySelectorAll('.js-product'),function(c){
      if(c.querySelector('.fzgf-chips'))return;
      var u=c.getAttribute('data-product-uid'),ids=D.pairs[u];if(!ids||!ids.length)return;
      var w=c.querySelector('.t-store__card__wrap_txt-and-btns')||c;
      var box=document.createElement('div');box.className='fzgf-chips';
      ids.forEach(function(id){var d=D.disks[id];if(!d)return;
        var b=document.createElement('button');b.type='button';b.className='fzgf-chip';b.setAttribute('data-d',id);
        b.innerHTML='<i style="background-image:url('+esc(d.i)+')"></i>Диск '+esc(d.z||'');
        b.onclick=function(e){e.preventDefault();e.stopPropagation();openDisk(id)};
        box.appendChild(b)});
      w.appendChild(box);
    });
  }
  /* ---- окно выбора ---- */
  function openModal(kind){
    modal=kind;$('fzgfS').value='';
    $('fzgfS').placeholder=kind==='b'?'Поиск марки...':(kind==='m'?'Поиск модели...':'Поиск дисков...');
    fill('');mo.classList.add('on');document.documentElement.style.overflow='hidden';setTimeout(function(){try{$('fzgfS').focus({preventScroll:true})}catch(e){}},50);
  }
  function closeModal(){mo.classList.remove('on');document.documentElement.style.overflow=''}
  function fill(q){
    q=(q||'').toLowerCase().trim();var g=$('fzgfG'),h='';g.className='fzgf-m__g'+(modal==='m'?' mod':'');
    if(modal==='b'){
      D.brands.forEach(function(b){if(q&&b.n.toLowerCase().indexOf(q)<0)return;
        h+='<button type="button" class="fzgf-m__i" data-k="'+esc(b.k)+'"><img class="lg" src="'+LOGO+esc(b.f)+'" alt="" loading="lazy">'+esc(b.n)+'<small>'+pl(b.c)+'</small></button>'});
    }else if(modal==='m'){
      (models()||[]).forEach(function(m){if(q&&m.t.toLowerCase().indexOf(q)<0&&m.s.toLowerCase().indexOf(q)<0)return;
        h+='<button type="button" class="fzgf-m__i" data-k="'+esc(m.id)+'"><img class="pic" src="'+esc(m.i)+'" alt="" loading="lazy">'+esc(m.t)+'<small>'+esc(m.s)+' · '+pl(m.u.length)+'</small></button>'});
    }else{
      var m=modelObj(st.m);((m&&m.d)||[]).forEach(function(id){var d=D.disks[id];if(!d)return;var t=d.z+' · '+d.l;if(q&&t.toLowerCase().indexOf(q)<0)return;
        h+='<button type="button" class="fzgf-m__i" data-k="'+esc(id)+'"><img class="dsk" src="'+esc(d.i)+'" alt="" loading="lazy">'+esc(d.z)+'<small>'+esc(d.l)+'</small></button>'});
    }
    g.innerHTML=h||'<div class="fzgf-m__e">Ничего не найдено</div>';
  }
  $('fzgfG').addEventListener('click',function(e){
    var b=e.target.closest('.fzgf-m__i');if(!b)return;var k=b.getAttribute('data-k');
    if(modal==='b'){selectBrand(k)}else if(modal==='m'){st.m=k;st.d='';apply()}else{st.d=k;apply()}
    closeModal();scrollToGrid();
  });
  function selectBrand(k){st.b=k;st.m='';st.d='';render();leftPick(k)}
  function scrollToGrid(){var bar=$('fzgf');setTimeout(function(){var y=bar.getBoundingClientRect().top+window.scrollY-110;if(Math.abs(window.scrollY-y)>40)window.scrollTo({top:y,behavior:'smooth'})},200)}
  $('fzgfS').addEventListener('input',function(){fill(this.value)});
  $('fzgfMx').onclick=closeModal;mo.onclick=function(e){if(e.target===mo)closeModal()};
  function bindField(id,kind,clear){
    $(id).addEventListener('click',function(e){
      var onX=e.target.closest('.fzgf__ic')&&!this.classList.contains('ph');
      if(onX){clear();return}
      openModal(kind);
    });
  }
  bindField('fzgfB','b',function(){st.b=st.m=st.d='';leftReset();setTimeout(apply,300);render()});
  bindField('fzgfM','m',function(){st.m=st.d='';apply()});
  bindField('fzgfD','d',function(){st.d='';apply()});
  /* ---- карточка диска ---- */
  var cur=null,k=0;
  function dshow(){var ph=cur.p&&cur.p.length?cur.p:[cur.i];$('fzgfDi').src=ph[k];$('fzgfDc').textContent=(k+1)+' / '+ph.length;[].forEach.call($('fzgfDt').children,function(t,j){t.className=j===k?'on':''})}
  function openDisk(id){
    var d=D.disks[id];if(!d)return;cur=d;cur.id=id;k=0;var ph=d.p&&d.p.length?d.p:[d.i];
    $('fzgfDh').textContent=d.z+' · '+d.l;$('fzgfDs').textContent=d.s||'';
    var th=$('fzgfDt');th.innerHTML='';ph.forEach(function(u,j){var im=document.createElement('img');im.src=u.replace('/resize/900x/','/resize/200x/');im.alt='';im.onclick=function(){k=j;dshow()};th.appendChild(im)});
    th.style.display=ph.length>1?'grid':'none';$('fzgfDp').style.display=$('fzgfDn').style.display=ph.length>1?'':'none';
    $('fzgfDw').href='https://wa.me/77019402422?text='+encodeURIComponent('Здравствуйте! Хочу такие диски: '+d.z+' '+d.l+'. Подскажите стоимость и сроки.');

  }
  function closeDisk(){dov.classList.remove('on');document.documentElement.style.overflow=''}
  $('fzgfDx').onclick=closeDisk;$('fzgfDb').onclick=closeDisk;dov.onclick=function(e){if(e.target===dov)closeDisk()};
  $('fzgfDn').onclick=function(){var n=(cur.p||[cur.i]).length;k=(k+1)%n;dshow()};
  $('fzgfDp').onclick=function(){var n=(cur.p||[cur.i]).length;k=(k-1+n)%n;dshow()};
  $('fzgfDa').onclick=function(){
    var id=cur.id,ms=(D.models.BMW||[]),mm=null;
    Object.keys(D.models).forEach(function(b){D.models[b].forEach(function(m){if(m.d.indexOf(id)>-1&&!mm){mm=m;if(st.b!==b){st.b=b;leftPick(b)}}})});

  /* ---- размещение над сеткой, выравнивание по карточкам ---- */

    var g=document.querySelector('.js-store-grid-cont');if(!g||root.hidden)return;
    var p=g.parentElement;if(root.parentElement!==p||root.nextElementSibling!==g)p.insertBefore(root,g);
    var pr=p.getBoundingClientRect(),gr=g.getBoundingClientRect(),vw=document.documentElement.clientWidth,off=vw>900?20:0;
    root.style.marginLeft=Math.max(0,gr.left-pr.left+off)+'px';root.style.width=Math.max(280,Math.min(gr.width-2*off,vw-gr.left-off*2))+'px';
