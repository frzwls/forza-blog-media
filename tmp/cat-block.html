<script>
(function(){

    var th=$('fzpbWdTh');th.innerHTML='';ph.forEach(function(u,j){var im=document.createElement('img');im.src=u.replace('/resize/900x/','/resize/200x/');im.alt='';im.onclick=function(){wk=j;wshow()};th.appendChild(im)});
    th.style.display=ph.length>1?'grid':'none';$('fzpbWdP').style.display=$('fzpbWdN').style.display=ph.length>1?'':'none';
    $('fzpbWdWa').href='https://wa.me/77019402422?text='+encodeURIComponent('Здравствуйте! Хочу диски: '+x.l+' ('+x.z+') для '+c.t+'. Подскажите стоимость и сроки.');
    var wd=$('fzpbWd');document.body.appendChild(wd);wd.classList.add('on');wd.scrollTop=0;wshow();
  }
  function closeWheel(){$('fzpbWd').classList.remove('on')}
  $('fzpbWdX').onclick=closeWheel;$('fzpbWdBack').onclick=closeWheel;$('fzpbWd').onclick=function(e){if(e.target===$('fzpbWd'))closeWheel()};
  $('fzpbWdN').onclick=function(){var n=(wcur.x.p||[wcur.x.i]).length;wk=(wk+1)%n;wshow()};
  $('fzpbWdP').onclick=function(){var n=(wcur.x.p||[wcur.x.i]).length;wk=(wk-1+n)%n;wshow()};
  function close(){lb.classList.remove('on');document.documentElement.style.overflow=''}
  $('fzpbX').onclick=close;lb.onclick=function(e){if(e.target===lb)close()};
  $('fzpbLN').onclick=function(){k=(k+1)%C[cur].imgs.length;show()};
  $('fzpbLP').onclick=function(){k=(k-1+C[cur].imgs.length)%C[cur].imgs.length;show()};
  $('fzpbN').onclick=function(){tr.scrollBy({left:424})};$('fzpbP').onclick=function(){tr.scrollBy({left:-424})};
  // перетаскивание ленты мышью (на тач-экранах работает родная прокрутка)
  var dn=0,mv=false,sx=0,sl=0;
  tr.addEventListener('mousedown',function(e){if(e.button!==0)return;dn=1;mv=false;sx=e.pageX;sl=tr.scrollLeft});
  window.addEventListener('mousemove',function(e){if(!dn)return;var dx=e.pageX-sx;if(!mv&&Math.abs(dx)>5){mv=true;tr.classList.add('drag')}if(mv){e.preventDefault();tr.scrollLeft=sl-dx}});
  window.addEventListener('mouseup',function(){if(!dn)return;dn=0;tr.classList.remove('drag')});
  tr.addEventListener('click',function(e){if(mv){e.preventDefault();e.stopPropagation();mv=false}},true);
  tr.addEventListener('dragstart',function(e){e.preventDefault()});
  document.addEventListener('keydown',function(e){if($('fzpbWd').classList.contains('on')){if(e.key==='Escape')closeWheel();if(e.key==='ArrowRight')$('fzpbWdN').click();if(e.key==='ArrowLeft')$('fzpbWdP').click();return}if(!lb.classList.contains('on'))return;if(e.key==='Escape')close();if(e.key==='ArrowRight')$('fzpbLN').click();if(e.key==='ArrowLeft')$('fzpbLP').click()});
  // показываем подборки, когда в фильтре «Марка автомобиля» выбрана ровно одна марка, для которой есть данные
  var cache={},curBrand='',shown='';
  function place(){
    var g=document.querySelector('.js-store-grid-cont');if(!g||sec.hidden)return;
    var p=g.parentElement;if(sec.parentElement!==p||sec.nextElementSibling!==g)p.insertBefore(sec,g);
    var pr=p.getBoundingClientRect(),gr=g.getBoundingClientRect(),vw=document.documentElement.clientWidth;
    var off=vw>900?20:0;sec.style.marginLeft=Math.max(0,gr.left-pr.left+off)+'px';sec.style.width=Math.max(300,vw-gr.left-off)+'px';
    $('fzpbT').previousElementSibling.style.maxWidth=Math.min(gr.width-2*off,vw-gr.left-off)+'px';
  }
  function apply(b,cars){C=cars;build();$('fzpbTt').textContent='Подборки дисков для '+b;sec.hidden=false;shown=b;place()}
  function load(b){
    var sl=SLUG[b.toUpperCase()];
    if(cache[sl]){apply(b,cache[sl]);return}
    var t=Math.floor(Date.now()/600000);
    fetch(DATA_BASE+sl+'.json?t='+t).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){cache[sl]=(d&&d.cars)||[];if(cache[sl].length&&curBrand===b)apply(b,cache[sl])}).catch(function(){})
  }
  function sync(){
    var el=document.querySelectorAll('#fzCarList .fz-cfopt.is-checked');
    var b=(el.length===1&&SLUG[(el[0].getAttribute('data-car')||'').toUpperCase()])?el[0].getAttribute('data-car'):'';
    if(b===curBrand){if(b&&shown===b)place();return}
    curBrand=b;
    if(!b){sec.hidden=true;shown='';return}
    load(b);
  }
  setInterval(sync,400);window.addEventListener('resize',place);
})();
</script>
