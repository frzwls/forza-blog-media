  .fz-cfg{

    --text:#f4f2ef;
    --text-dim:#9b9793;
    --text-faint:#635f5b;
    --accent:#b3332b;
    --accent-hover:#c8443b;

  .fz-cfg .app{

  .fz-cfg .eyebrow-label{

    font-weight:700;

    text-transform:uppercase;

    line-height:1.15;
    text-wrap:balance;

  .fz-cfg .subline{

    flex-direction:column;
    gap:2px;
    position:sticky;
    top:24px;
  }
  @media (max-width:860px){
    .fz-cfg .stepper{
      position:static;
      flex-direction:row;
      overflow-x:auto;
      gap:0;
      padding-bottom:4px;
    }
  }

  .fz-cfg .step-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:12px 10px;
    border-radius:10px;
    opacity:0.45;
    transition:opacity .2s ease;
  }
  .fz-cfg .step-row.done, .fz-cfg .step-row.active{ opacity:1; }

      gap:6px;

    }
    .fz-cfg .step-row.active{ border-bottom-color:var(--accent); }
  }

  .fz-cfg .step-num{
    width:26px;height:26px;
    border-radius:50%;
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;
    color:var(--text-dim);
    flex-shrink:0;
    transition:all .2s ease;
  }
  .fz-cfg .step-row.active .step-num{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .fz-cfg .step-row.done .step-num{
    background:transparent;
    border-color:var(--accent);
    color:var(--accent);
  }
  .fz-cfg .step-copy{ min-width:0; }
  .fz-cfg .step-title{
    font-size:13px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .fz-cfg .step-value{
    font-size:12px;
    color:var(--accent);
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .fz-cfg .step-value:empty::before{
    content:'—';
    color:var(--text-faint);
  }

  .fz-cfg .panel{ min-width:0; }
  .fz-cfg .panel-heading{
    font-size:12px;
    font-weight:600;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--text-faint);
    margin:0 0 4px;
  }
  .fz-cfg .panel-question{
    font-size:clamp(19px,2.4vw,25px);
    font-weight:600;
    margin:0 0 22px;
    text-wrap:balance;
  }

  .fz-cfg .brand-search{
    max-width:280px;
    margin:0 0 28px;
    position:relative;
  }
  .fz-cfg .brand-search input{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:9px;
    padding:10px 14px 10px 34px;
    color:var(--text);
    font-size:13.5px;
    font-family:'Inter',sans-serif;
  }
  .fz-cfg .brand-search input:focus{ outline:none; border-color:var(--accent); }
  .fz-cfg .brand-search input::placeholder{ color:var(--text-faint); }

    border-radius:50%;
  }
  .fz-cfg .brand-search::after{
    content:'';
    position:absolute;
    left:21px; top:50%;
    width:5px; height:1.5px;
    margin-top:3px;
    background:var(--text-faint);
    transform:rotate(45deg);
    transform-origin:left center;
  }

  .fz-cfg .option-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
    gap:12px;
  }
  .fz-cfg .option-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px 14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .fz-cfg .option-card:hover{ border-color:#3a3a3a; transform:translateY(-1px); }
  .fz-cfg .option-card.selected{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .fz-cfg .option-glyph{
    width:44px;height:44px;
    border-radius:50%;
    background:var(--surface-2);
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:14px;
    font-weight:600;
    color:var(--text-dim);
  }
  .fz-cfg .option-card.selected .option-glyph{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .fz-cfg .option-label{
    font-size:13.5px;
    font-weight:600;
    color:var(--text);
  }
  .fz-cfg .option-sub{
    font-size:11.5px;
    color:var(--text-faint);
  }

  .fz-cfg .option-glyph svg{ width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.6; }

  .fz-cfg .option-card.disabled{ cursor:not-allowed; opacity:0.4; }
  .fz-cfg .option-card.disabled:hover{ border-color:var(--border); transform:none; }
  .fz-cfg .option-card.disabled .option-glyph{ background:var(--surface); }
  .fz-cfg .option-card.disabled .option-sub{ font-style:italic; }
  .fz-cfg .option-card.disabled .option-sub b{ color:#8a7370; font-style:normal; }
  .fz-cfg .option-card.photo.disabled .photo-bg{ filter:grayscale(1) brightness(.5); }
  .fz-cfg .option-card.photo .option-sub{ color:rgba(255,255,255,0.65); }
  .fz-cfg .option-card.photo.disabled .option-sub{ color:rgba(255,255,255,0.55); }

  .fz-cfg .style-grid{ grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; }
  .fz-cfg .style-grid .option-card.photo{ aspect-ratio:1/1; }
  .fz-cfg .style-grid .option-label{ font-size:17px; }
  .fz-cfg .style-grid .option-sub{ font-size:13px; }
  .fz-cfg .style-grid .photo-overlay{ padding:16px 16px 14px; }

    .fz-cfg .style-grid{ grid-template-columns:repeat(2,1fr) !important; gap:10px !important; }

    .fz-cfg .style-grid .option-sub{ font-size:10.5px !important; }
    .fz-cfg .style-grid .photo-overlay{ padding:10px 10px 8px !important; }

    color:var(--text);

  .fz-cfg .summary-row dd{ margin:0; font-weight:600; color:var(--text); }

  .fz-cfg .success-title{
    font-size:20px;

    text-transform:uppercase;

  .fz-cfg .success-text{
    color:var(--text-dim);
    font-size:14px;
    max-width:44ch;
    margin:0 auto;
    line-height:1.6;
  }

  .fz-cfg [hidden]{ display:none!important; }

  /* На странице конфигуратора форма заявки из общего подвала не нужна — свой сбор параметров есть на шаге "Заявка" */
  .fz-cta{ display:none !important; }

  var FZ_DATA_URL = 'https://raw.githubusercontent.com/frzwls/forza-blog-media/main/data/gallery-filter.json';

          : (s.key === 'model') ? (selection.modelTitle || 'Любая модель')

  /* ---- подборка дисков ---- */
  function fzStyleOk(id, key){
    var t = (fzData.st && fzData.st[id]) || '';
    if (key === 'mono') return !t;
    if (key === 'multi') return t.indexOf('p') > -1;
    if (key === 'beadlock') return t.indexOf('b') > -1;
    if (key === 'spoke') return t.indexOf('w') > -1;
    return true;
  }
  function fzDiams(d){
    var m = String(d.z || '').match(/R(\d{2})(?:\/(\d{2}))?/);
    return m ? [parseInt(m[1], 10)].concat(m[2] ? [parseInt(m[2], 10)] : []) : null;
  }
  function fzCandidates(){
    var bk = fzBrandKey(selection.brand);
    if (!fzData || !bk) return null;
    var m = null;
    (fzData.models[bk] || []).forEach(function(x){ if (x.id === selection.model) m = x; });
    var bd = (fzData.bd && fzData.bd[bk]) || {};
    var seen = {}, out = [];
    function add(ids, score, why){
      (ids || []).forEach(function(id){
        var d = fzData.disks[id];
        if (seen[id] || !d || !d.i) return;
        seen[id] = 1;
        out.push({ id:id, d:d, score:score, why:why });
      });
    }
    var bn = selection.brand;
    if (m){
      add(m.d, 100, 'Стоял на нашем проекте ' + m.t);
      add(m.x, 80, 'Подходит для ' + m.t);
      add(m.m, 75, 'Магниевый для ' + m.t);
      add(bd.d, 40, 'С других наших проектов ' + bn);
      add(bd.x, 30, 'Из каталога для ' + bn);
      add(bd.m, 25, 'Магниевый для ' + bn);
    } else {
      add(bd.d, 90, 'Стоял на нашем проекте ' + bn);
      add(bd.x, 60, 'Из каталога для ' + bn);
      add(bd.m, 55, 'Магниевый для ' + bn);
    }
    return out;
  }
  function fzPicks(){
    var cand = fzCandidates();
    if (!cand) return null;
    var key = selection.style;
    var list = cand.filter(function(c){ return fzStyleOk(c.id, key); });
    var note = '';
    var n = selection.diameter ? parseInt(String(selection.diameter).replace(/\D/g, ''), 10) : 0;
    if (n){
      var byD = [];
      list.forEach(function(c){
        var ds = fzDiams(c.d);
        if (!ds) byD.push(c);
        else if (ds.indexOf(n) > -1){ c.score += 10; byD.push(c); }
      });
      if (byD.length) list = byD; else if (list.length) note = 'diam';
    }
    var cls = fzClass();
    var minD = (cls === 'suv' || cls === 'off' || cls === 'lux') ? 19 : (cls === 'sport' ? 18 : 0);
    if (minD) list.forEach(function(c){
      var ds = fzDiams(c.d);
      if (ds && Math.max.apply(null, ds) < minD) c.score -= 60;
    });
    list.sort(function(a, b){ return b.score - a.score; });
    return { list: list, note: note };
  }
  function fzStyleCountHtml(key){
    var cand = fzCandidates();
    if (!cand) return '';
    var n = cand.filter(function(c){ return fzStyleOk(c.id, key); }).length;
    return '<span class="cnt">' + (n ? n + ' в подборке' : 'изготовим под заказ') + '</span>';
  }

  /* ---- совет по стилю: по типу машины (спорт / представительская / внедорожник-кроссовер / джип) ---- */
  function fzClass(){
    var s = (String(selection.brand || '') + ' ' + String(selection.modelTitle || '')).toUpperCase();

    if (/CAYENNE|MACAN|URUS|ESCALADE|X5|X6|X7|XM\b|GLE|GLS|RANGE ROVER|LAND CRUISER|LEXUS|LX|GX|Q[5-8]|TAHOE|PALISADE|SANTA|SPORTAGE|TERAMONT|LIXIANG|AITO|AVATR|DENZA|ZEEKR/.test(s)) return 'suv';
    if (/PORSCHE|MCLAREN|LAMBORGHINI|NISSAN|M2|M3|M4|M5|M8|AMG GT|C-CLASS|C63|RS ?[3-7]|LUCID|TESLA|CORVETTE/.test(s)) return 'sport';

      multi: 'Составной диск для внедорожника нужен редко: берите его ради внешнего вида, а не нагрузки.',
      beadlock: 'Бедлок родной стиль для Jeep, Defender и G-Class: прижимное кольцо по контуру даёт внедорожный характер и позволяет ездить на пониженном давлении.',
      spoke: 'Спицевый рисунок на внедорожнике ретро-вариант (старый Defender, Land Cruiser). Для современной машины чаще берут моноблок.'
    },
    base: {
      mono: 'Моноблок самый универсальный вариант: лёгкий, прочный и подходит большинству машин.',
      multi: 'Составной диск даёт больше вариантов по вылету и ширине, а полированный обод добавляет акцент.',
      beadlock: 'Бедлок подходит для внедорожного образа и редко уместен на городской машине.',
      spoke: 'Спицевый рисунок классика, лучше всего он смотрится на представительских машинах и ретро.'
    }
  };
  function fzAdvice(styleKey){
    var c = FZ_ADVICE[fzClass()] || FZ_ADVICE.base;
    return c[styleKey] || '';
  }

  function buildModelStepBody(){
    var wrap = document.createElement('div');
    var grid = document.createElement('div');
    grid.className = 'option-grid style-grid';
    function addCard(id, title, subText, img){
      var card = document.createElement('div');
      card.className = 'option-card photo' + (selection.model !== undefined && (selection.model || '') === id ? ' selected' : '');
      card.tabIndex = 0;
      var bg = document.createElement('div');
      bg.className = 'photo-bg' + (img ? '' : ' placeholder');
      if (img){ bg.style.backgroundImage = "url('" + img + "')"; }
      else { var g = document.createElement('span'); g.className = 'photo-placeholder-glyph'; g.textContent = '?'; bg.appendChild(g); }
      var overlay = document.createElement('div');
      overlay.className = 'photo-overlay';
      var label = document.createElement('div');
      label.className = 'option-label';
      label.textContent = title;
      var sub = document.createElement('div');
      sub.className = 'option-sub';
      sub.textContent = subText || '';
      overlay.appendChild(label);
      overlay.appendChild(sub);
      card.appendChild(bg);
      card.appendChild(overlay);
      function choose(){
        if ((selection.model || '') !== id){ selection.disk = null; selection.diskLabel = ''; selection.diskUrl = ''; }
        selection.model = id;
        selection.modelTitle = id ? title : '';
        if (current < STEPS.length - 1) current += 1;
        render(true);
      }
      card.addEventListener('click', choose);
      card.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); choose(); } });
      grid.appendChild(card);
    }
    addCard('', 'Любая модель', 'покажем диски всей марки', '');
    fzModels().forEach(function(m){ addCard(m.id, m.t, m.s || '', m.i); });
    wrap.appendChild(grid);
    return wrap;
  }

  function buildPicks(){
    var wrap = document.createElement('div');
    wrap.className = 'picks';
    if (!selection.style || selection.brand === 'Другая марка' || !fzData) return wrap;
    var res = fzPicks();
    var styleObj = DISK_STYLES.filter(function(x){ return x.key === selection.style; })[0] || {};
    var head = document.createElement('div');
    head.className = 'picks__title';
    head.textContent = 'Подборка: ' + (selection.modelTitle || selection.brand) + ' · ' + (styleObj.label || '') + (selection.diameter ? ' · ' + selection.diameter : '');
    wrap.appendChild(head);
    var tipText = fzAdvice(selection.style);
    if (tipText){
      var tip = document.createElement('div');
      tip.className = 'picks__tip';
      var tb = document.createElement('b');
      tb.textContent = 'Совет по стилю. ';
      tip.appendChild(tb);
      tip.appendChild(document.createTextNode(tipText));
      wrap.appendChild(tip);
    }
    if (!res){
      var e0 = document.createElement('div');
      e0.className = 'picks__empty';
      e0.textContent = 'Для вашей марки готовых дизайнов в подборке пока нет. Выберите стиль и размер, остальное подберём вручную.';
      wrap.appendChild(e0);
      return wrap;
    }
    if (!res.list.length){
      var e1 = document.createElement('div');
      e1.className = 'picks__empty';
      e1.textContent = 'В стиле «' + (styleObj.label || '') + '» готовых дисков под вашу машину у нас пока нет. Изготовим любой дизайн, размер и цвет: выберите размер и нажмите «Далее».';
      wrap.appendChild(e1);
      return wrap;
    }
    if (res.note === 'diam'){
      var nt = document.createElement('div');
      nt.className = 'picks__note';
      nt.textContent = 'В размере ' + selection.diameter + ' готовых нет. Показываем этот стиль в других размерах: любой дизайн мы изготовим в нужном диаметре.';
      wrap.appendChild(nt);
    }
    var limit = selection.picksLimit || 8;
    var grid = document.createElement('div');
    grid.className = 'picks__grid';
    res.list.slice(0, limit).forEach(function(c){
      var card = document.createElement('div');
      card.className = 'pick' + (selection.disk === c.id ? ' selected' : '');
      card.tabIndex = 0;
      var img = document.createElement('div');
      img.className = 'pick__img';
      img.style.backgroundImage = "url('" + c.d.i + "')";
      var body = document.createElement('div');
      body.className = 'pick__body';
      var z = document.createElement('div');
      z.className = 'pick__z';
      z.textContent = c.d.z || '';
      var l = document.createElement('div');
      l.className = 'pick__l';
      l.textContent = c.d.l || '';
      var why = document.createElement('div');
      why.className = 'pick__why';
      why.textContent = c.why;
      body.appendChild(z);
      body.appendChild(l);
      body.appendChild(why);
      if (c.d.u){
        var a = document.createElement('a');
        a.className = 'pick__link';
        a.href = c.d.u;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = 'Открыть в каталоге';
        a.addEventListener('click', function(ev){ ev.stopPropagation(); });
        body.appendChild(a);
      }
      card.appendChild(img);
      card.appendChild(body);
      function pickIt(){
        if (selection.disk === c.id){ selection.disk = null; selection.diskLabel = ''; selection.diskUrl = ''; }
        else {
          selection.disk = c.id;
          selection.diskLabel = (c.d.z ? c.d.z + ' · ' : '') + (c.d.l || '');
          selection.diskUrl = c.d.u || '';
          var ds = fzDiams(c.d);
          if (ds && ds.length === 1 && !selection.diameter){ selection.diameter = 'R' + ds[0]; }
        }
        render(false);
      }
      card.addEventListener('click', pickIt);
      card.addEventListener('keydown', function(ev){ if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); pickIt(); } });
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
    if (res.list.length > limit){
      var more = document.createElement('div');
      more.className = 'picks__more';
      more.textContent = 'Показать ещё (' + (res.list.length - limit) + ')';
      more.tabIndex = 0;
      more.addEventListener('click', function(){ selection.picksLimit = limit + 8; render(false); });
      wrap.appendChild(more);
    }
    return wrap;
  }

  function buildWhatsappUrl(){
    var brandLine = selection.brand === 'Другая марка'
      ? (selection.brandOther || 'Другая марка')
      : selection.brand;
    var lines = ['Здравствуйте! Хочу подобрать диски через конфигуратор на сайте.'];
    lines.push('Марка авто: ' + (brandLine || '—'));
    if (selection.modelTitle) lines.push('Модель: ' + selection.modelTitle);
    var styleObj = DISK_STYLES.filter(function(x){ return x.key === selection.style; })[0];
    lines.push('Стиль диска: ' + (styleObj ? styleObj.label : '—'));
    lines.push('Диаметр: ' + (selection.diameter || '—'));
    if (selection.diskLabel) lines.push('Выбранный диск: ' + selection.diskLabel + (selection.diskUrl ? ' ' + selection.diskUrl : ''));
    var name = (document.getElementById('fzCfgName') || {}).value;
    var phone = (document.getElementById('fzCfgPhone') || {}).value;
    var wishes = (document.getElementById('fzCfgWishes') || {}).value;
    if (name) lines.push('Имя: ' + name);
    if (phone) lines.push('Телефон: ' + phone);
    if (wishes) lines.push('Пожелания: ' + wishes);
    return 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(lines.join('\n'));
  }

  function renderLeadStep(){
    var wrap = document.createElement('div');

    if (submitted){
      var ok = document.createElement('div');
      ok.className = 'success-panel';
      ok.innerHTML = '<div class="success-glyph">✓</div>' +
        '<h2 class="success-title">Заявка сформирована</h2>' +
        '<p class="success-text">Мы открыли WhatsApp с уже заполненным сообщением — просто нажмите «Отправить» в чате, и наш менеджер свяжется с вами.</p>';
      wrap.appendChild(ok);
      return wrap;
    }

    var eyebrow = document.createElement('p');
    eyebrow.className = 'panel-heading';
    eyebrow.textContent = 'Последний шаг';
    var q = document.createElement('h2');
    q.className = 'panel-question';
    q.textContent = 'Проверьте параметры и оставьте заявку';
    wrap.appendChild(eyebrow);
    wrap.appendChild(q);

    var brandValue = selection.brand === 'Другая марка'
      ? (selection.brandOther || 'Другая марка') + ' (другая марка)'

    var styleObjLead = DISK_STYLES.filter(function(x){ return x.key === selection.style; })[0];

    [['brandDisplay','Марка авто']].concat(selection.modelTitle ? [['modelDisplay','Модель']] : []).concat([['styleDisplay','Стиль диска'],['diameter','Диаметр']]).concat(selection.diskLabel ? [['diskDisplay','Выбранный диск']] : []).forEach(function(pair){
      var row = document.createElement('div');
      row.className = 'summary-row';
      var dt = document.createElement('dt');
      dt.textContent = pair[1];
      var dd = document.createElement('dd');
      dd.textContent = (pair[0] === 'brandDisplay' ? brandValue : pair[0] === 'styleDisplay' ? (styleObjLead ? styleObjLead.label : '') : pair[0] === 'modelDisplay' ? selection.modelTitle : pair[0] === 'diskDisplay' ? selection.diskLabel : selection[pair[0]]) || '—';
      row.appendChild(dt);
      row.appendChild(dd);
      card.appendChild(row);

    wrap.appendChild(card);

    formGrid.innerHTML =

      '<div class="field"><label>Телефон</label><input type="tel" id="fzCfgPhone" placeholder="+7 700 000 00 00" /></div>' +
      '<div class="field field-full"><label>Пожелания <span class="field-optional">(необязательно)</span></label>' +
      '<textarea id="fzCfgWishes" placeholder="Например: хочу цвет в тон кузова"></textarea></div>';
    wrap.appendChild(formGrid);

    return wrap;
  }

  var appEl = document.getElementById('fzCfgApp');

  function render(scrollToTop){
    if (bodyEl.contains(document.activeElement)) { document.activeElement.blur(); }

    var step = STEPS[current];
    bodyEl.innerHTML = '';
    bodyEl.appendChild(step.key === 'lead' ? renderLeadStep() : renderOptionStep(step));
    renderStepper();

    btnBack.style.visibility = current === 0 ? 'hidden' : 'visible';

    if (step.key === 'lead'){
      btnNext.textContent = submitted ? 'Начать заново' : 'Отправить в WhatsApp';
      btnNext.disabled = false;
    } else {
      btnNext.textContent = 'Далее';
      var hasValue = step.key === 'model' ? true : step.key === 'disk' ? !!(selection.style && selection.diameter) : !!selection[step.key];
      var needsOther = step.key === 'brand' && selection.brand === 'Другая марка';

        requestAnimationFrame(function(){
          setTimeout(function(){
            appEl.scrollIntoView({ behavior: 'instant', block: 'start' });
          }, 60);
        });
      });
    }
  }

  btnBack.addEventListener('click', function(){
    if (current > 0){ current -= 1; render(true); }
  });

  btnNext.addEventListener('click', function(){

        rebuildSteps();
        render(true);
      } else {
        window.open(buildWhatsappUrl(), '_blank');
        submitted = true;
        render(true);
      }
      return;
    }

      current += 1;
      render(true);
    }
  });

  render();
})();
